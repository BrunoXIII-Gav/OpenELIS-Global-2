<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenELIS SSO</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          sessionStorage.setItem("openelis.portalSamlLaunch", "1");
          sessionStorage.removeItem("openelis.loggedOutToPortal");
        } catch (_error) {
          // no-op
        }

        window.location.replace("/api/OpenELIS-Global/LoginPage?useSAML=true&redirect=true");
      })();
    </script>
  </body>
</html>

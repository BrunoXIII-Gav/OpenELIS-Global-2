<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenELIS SSO</title>
  </head>
  <body>
    <script>
      (async function () {
        const SESSION_ENDPOINT = "/api/OpenELIS-Global/session";
        const LOGIN_URL =
          "/api/OpenELIS-Global/LoginPage?useSAML=true&redirect=true";
        const FRONTEND_ROOT = "/";

        try {
          sessionStorage.setItem("openelis.portalSamlLaunch", "1");
          sessionStorage.removeItem("openelis.loggedOutToPortal");
        } catch (_error) {
          // no-op
        }

        try {
          const response = await fetch(SESSION_ENDPOINT, {
            credentials: "include",
            cache: "no-store",
          });

          if (response.ok) {
            const session = await response.json();
            if (session && session.authenticated) {
              window.location.replace(FRONTEND_ROOT);
              return;
            }
          }
        } catch (_error) {
          // fall through to the normal SAML launch
        }

        window.location.replace(LOGIN_URL);
      })();
    </script>
  </body>
</html>
